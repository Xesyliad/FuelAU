[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
files = ["src/sync_utils.py", "src/history_cleanup.py", "scripts/build-terrain-mbtiles.py"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

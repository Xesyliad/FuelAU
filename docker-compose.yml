services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-18080}:80"
    volumes:
      - ./config/app.env:/etc/fuelapi/app.env:ro
      - ./config/mysql.env:/etc/fuelapi/mysql.env:ro
      - ./var/docker:/var/www/html/var/docker
      - ./var/docker/app-logs:/var/log/fuelapi
    environment:
      APP_ENV: "${APP_ENV:-local}"
      CONTAINER_MANAGEMENT_ENABLED: "false"
      FUELAU_DOCKER_PROJECT: "${COMPOSE_PROJECT_NAME:-fuelau}"
      TZ: "${TZ:-Australia/Brisbane}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$body = @file_get_contents("http://127.0.0.1/api/health");
          exit($$body === false ? 1 : 0);'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    profiles:
      - admin
    depends_on:
      db:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    ports:
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HTTP_PORT:-18083}:80"
    volumes:
      - ./config/app.env:/etc/fuelapi/app.env:ro
      - ./config/mysql.env:/etc/fuelapi/mysql.env:ro
      - ./var/docker:/var/www/html/var/docker
      - ./var/docker/app-logs:/var/log/fuelapi
    environment:
      APP_ENV: "${APP_ENV:-local}"
      CONTAINER_MANAGEMENT_ENABLED: "true"
      CONTAINER_MANAGEMENT_TOKEN: "${CONTAINER_MANAGEMENT_TOKEN:-}"
      FUELAU_CRON_ENABLED: "false"
      FUELAU_DOCKER_API_ADDRESS: "docker-proxy:2375"
      FUELAU_DOCKER_PROJECT: "${COMPOSE_PROJECT_NAME:-fuelau}"
      TZ: "${TZ:-Australia/Brisbane}"
    networks:
      - default
      - docker-admin
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$body = @file_get_contents("http://127.0.0.1/api/health");
          exit($$body === false ? 1 : 0);'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  docker-proxy:
    image: haproxy:3.4-alpine@sha256:fb87fc81943143b9acaea7442973e6ba654035fff76ffe7af6829dd1bcb0f7a5
    profiles:
      - admin
    user: "0:0"
    volumes:
      - ./docker/docker-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-admin
    read_only: true
    tmpfs:
      - /run
      - /var/lib/haproxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  db:
    image: mariadb:12.3.3@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    user: "${UID:-999}:${GID:-999}"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-fuelau}"
      MYSQL_USER: "${MYSQL_USER:-fuelau}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
      MYSQL_APP_USERNAME: "${MYSQL_APP_USER:-}"
      MYSQL_APP_PASSWORD: "${MYSQL_APP_PASSWORD:-}"
      MYSQL_SYNC_USERNAME: "${MYSQL_SYNC_USER:-}"
      MYSQL_SYNC_PASSWORD: "${MYSQL_SYNC_PASSWORD:-}"
      TZ: "${TZ:-Australia/Brisbane}"
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ./var/docker/db-data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nominatim:
    image: mediagis/nominatim:5.3.2@sha256:7923a8e67197fc6d4f4ecb7c0e8bbedffeddcfdf4519596fe946e46a28f5a9f8
    # The upstream script enables xtrace in its shebang, which would expose NOMINATIM_PASSWORD in Docker logs.
    command: ["bash", "-e", "+x", "/app/start.sh"]
    profiles:
      - routing
    depends_on:
      app:
        condition: service_started
    environment:
      PBF_URL: https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/australia-oceania/australia-updates
      UPDATE_MODE: continuous
      NOMINATIM_PASSWORD: "${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD in .env}"
      THREADS: "${NOMINATIM_THREADS:-4}"
      GUNICORN_WORKERS: "${NOMINATIM_GUNICORN_WORKERS:-4}"
      HOME: /home/nominatim
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
      FREEZE: "false"
      TZ: "${TZ:-Australia/Brisbane}"
    ports:
      - "127.0.0.1:${NOMINATIM_HTTP_PORT:-18081}:8080"
    volumes:
      - ./var/docker/nominatim-db:/var/lib/postgresql
      - ./var/docker/nominatim-flatnode:/nominatim/flatnode
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/status', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m
    restart: unless-stopped

  photon-import:
    image: fuelau-photon:1.3.0
    build:
      context: .
      dockerfile: docker/photon/Dockerfile
    profiles:
      - photon-setup
      - photon-eval-setup
    command: import
    environment:
      JAVA_TOOL_OPTIONS: "${PHOTON_IMPORT_JAVA_TOOL_OPTIONS:--Xms512m -Xmx3g}"
      PHOTON_DATA_ROOT: /data
      PHOTON_IMPORT_FILE: /input/photon-dump-australia-1.0-latest.jsonl.zst
      PHOTON_IMPORT_SHA256: 95f8a16e8dbbd0f869f3c91bc37d8b4721e24cb835450483007c3ccfd1f2a829
      PHOTON_IMPORT_THREADS: "${PHOTON_IMPORT_THREADS:-2}"
      PHOTON_INDEX_RETENTION: "${PHOTON_INDEX_RETENTION:-3}"
    volumes:
      - ./var/docker/photon-input:/input:ro
      - ./var/docker/photon-eval:/data
    # Leave native/OpenSearch headroom above the 3 GiB JVM heap during import.
    mem_limit: 4g
    cpus: 2.0

  photon-refresh:
    image: fuelau-photon:1.3.0
    build:
      context: .
      dockerfile: docker/photon/Dockerfile
    profiles:
      - photon-setup
    command: refresh
    environment:
      JAVA_TOOL_OPTIONS: "${PHOTON_IMPORT_JAVA_TOOL_OPTIONS:--Xms512m -Xmx3g}"
      PHOTON_DATA_ROOT: /data
      PHOTON_INPUT_ROOT: /input
      PHOTON_IMPORT_THREADS: "${PHOTON_IMPORT_THREADS:-2}"
      PHOTON_INDEX_RETENTION: "${PHOTON_INDEX_RETENTION:-3}"
      PHOTON_SNAPSHOT_URL: "${PHOTON_SNAPSHOT_URL:-https://download1.graphhopper.com/public/australia-oceania/australia/photon-dump-australia-1.0-latest.jsonl.zst}"
    volumes:
      - ./var/docker/photon-input:/input
      - ./var/docker/photon-eval:/data
    mem_limit: 4g
    cpus: 2.0

  photon:
    image: fuelau-photon:1.3.0
    build:
      context: .
      dockerfile: docker/photon/Dockerfile
    profiles:
      - routing
      - photon-eval
    command: serve
    environment:
      JAVA_TOOL_OPTIONS: "${PHOTON_JAVA_TOOL_OPTIONS:--Xms512m -Xmx2g}"
      PHOTON_DATA_ROOT: /data
      PHOTON_MAX_RESULTS: "${PHOTON_MAX_RESULTS:-10}"
      PHOTON_MAX_REVERSE_RESULTS: "${PHOTON_MAX_REVERSE_RESULTS:-10}"
      PHOTON_QUERY_TIMEOUT_SECONDS: "${PHOTON_QUERY_TIMEOUT_SECONDS:-5}"
    ports:
      - "127.0.0.1:${PHOTON_HTTP_PORT:-12322}:2322"
    volumes:
      - ./var/docker/photon-eval:/data
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:2322/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 2m
    restart: unless-stopped

  photon-scheduler:
    image: docker:29-cli@sha256:000bb62ff495f986c9f5578eb67cc2cb98b91138eda81d7762d5371eb8a497fe
    profiles:
      - routing
    working_dir: "${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}"
    environment:
      FUELAU_HOST_PROJECT_ROOT: "${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}"
      PHOTON_REFRESH_CRON: "${PHOTON_REFRESH_CRON:-15 2 * * 1}"
      TZ: "${PHOTON_SCHEDULER_TZ:-AEST-10}"
    command:
      - sh
      - -c
      - |
        mkdir -p var/docker/app-logs
        printf '%s\n' "$${PHOTON_REFRESH_CRON} cd $${FUELAU_HOST_PROJECT_ROOT} && scripts/run-photon-refresh.sh >> var/docker/app-logs/photon_refresh.log 2>&1" > /etc/crontabs/root
        crond -f -l 8
    volumes:
      - "${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}:${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}"
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  osrm-download:
    image: curlimages/curl:8.21.0
    profiles:
      - routing-setup
    user: "0:0"
    command:
      - -L
      - --fail
      - --output
      - /data/australia-latest.osm.pbf
      - https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
    volumes:
      - ./var/docker/osrm-data:/data

  osrm-extract:
    image: ghcr.io/project-osrm/osrm-backend:v26.8.0-debian@sha256:3ac496ff8fd7e1af53846179d73d06a97f719c8ad2217d008ed868942398665c
    profiles:
      - routing-setup
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    command:
      - osrm-extract
      - -p
      - /opt/fuelmiser.car.lua
      - /data/australia-latest.osm.pbf
    volumes:
      - ./config/osrm/fuelmiser.car.profile.template.lua:/opt/fuelmiser.car.lua:ro
      - ./var/docker/osrm-data:/data

  osrm-partition:
    image: ghcr.io/project-osrm/osrm-backend:v26.8.0-debian@sha256:3ac496ff8fd7e1af53846179d73d06a97f719c8ad2217d008ed868942398665c
    profiles:
      - routing-setup
    depends_on:
      osrm-extract:
        condition: service_completed_successfully
    command:
      - osrm-partition
      - /data/australia-latest.osrm
    volumes:
      - ./var/docker/osrm-data:/data

  osrm-customize:
    image: ghcr.io/project-osrm/osrm-backend:v26.8.0-debian@sha256:3ac496ff8fd7e1af53846179d73d06a97f719c8ad2217d008ed868942398665c
    profiles:
      - routing-setup
    depends_on:
      osrm-partition:
        condition: service_completed_successfully
    command:
      - osrm-customize
      - /data/australia-latest.osrm
    volumes:
      - ./var/docker/osrm-data:/data

  osrm-routed:
    image: ghcr.io/project-osrm/osrm-backend:v26.8.0-debian@sha256:3ac496ff8fd7e1af53846179d73d06a97f719c8ad2217d008ed868942398665c
    profiles:
      - routing
    depends_on:
      app:
        condition: service_started
      osrm-customize:
        condition: service_completed_successfully
        required: false
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/australia-latest.osrm
    ports:
      - "127.0.0.1:${OSRM_HTTP_PORT:-15000}:5000"
    volumes:
      - ./var/docker/osrm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/5000'"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  map-build:
    build:
      context: .
      dockerfile: docker/map-build/Dockerfile
    profiles:
      - map-setup
    environment:
      JAVA_TOOL_OPTIONS: "${MAP_BUILD_JAVA_TOOL_OPTIONS:--Xmx4g}"
      MAP_MINIMUM_TILES: "${MAP_MINIMUM_TILES:-1000}"
      MAP_OUTPUT: /data/australia.mbtiles
      TZ: "${TZ:-Australia/Brisbane}"
    command:
      - --download
      - --area=australia
      - --maxzoom=13
      - --render_maxzoom=13
      - --threads=2
    volumes:
      - ./var/docker/map-tiles:/data

  terrain-build:
    image: python:3.14-slim
    profiles:
      - map-setup
    environment:
      TZ: "${TZ:-Australia/Brisbane}"
    command:
      - python
      - /workspace/scripts/build-terrain-mbtiles.py
      - --output=/data/terrain.mbtiles
      - --workers=4
      - --max-zoom=8
    volumes:
      - ./var/docker/map-tiles:/data
      - ./scripts:/workspace/scripts:ro

  map-server:
    image: maptiler/tileserver-gl-light:v5.6.0
    profiles:
      - map
    depends_on:
      app:
        condition: service_started
      map-build:
        condition: service_completed_successfully
        required: false
      terrain-build:
        condition: service_completed_successfully
        required: false
    command:
      - --public_url
      - /tiles/
    ports:
      - "127.0.0.1:${MAP_TILE_PORT:-18082}:8080"
    volumes:
      - ./var/docker/map-tiles:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http'); const checks=['http://127.0.0.1:8080/styles.json','http://127.0.0.1:8080/data/australia.json','http://127.0.0.1:8080/data/australia/13/7536/4916.pbf']; const check=(url)=>new Promise((resolve,reject)=>{http.get(url,res=>{res.resume(); if(res.statusCode===200) resolve(); else reject(new Error(url+' status '+res.statusCode));}).on('error',reject);}); Promise.all(checks.map(check)).then(()=>process.exit(0)).catch(()=>process.exit(1));\""
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1m
    restart: unless-stopped

  map-scheduler:
    image: docker:29-cli
    profiles:
      - map
    depends_on:
      map-server:
        condition: service_healthy
        required: false
    working_dir: "${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}"
    environment:
      FUELAU_HOST_PROJECT_ROOT: "${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}"
      # docker:cli has no zoneinfo database, so use a POSIX timezone that musl
      # can apply directly. Brisbane has no daylight-saving transition.
      TZ: "${MAP_SCHEDULER_TZ:-AEST-10}"
    command:
      - sh
      - -c
      - |
        mkdir -p var/docker/app-logs
        printf '%s\n' "5 3 * * 0 cd $${FUELAU_HOST_PROJECT_ROOT} && docker compose --profile map-setup run --rm terrain-build >> var/docker/app-logs/terrain_build.log 2>&1" > /etc/crontabs/root
        printf '%s\n' "10 3 * * 0 cd $${FUELAU_HOST_PROJECT_ROOT} && (docker compose --profile map-setup run --rm map-build && docker compose --profile map restart map-server) >> var/docker/app-logs/map_build.log 2>&1" >> /etc/crontabs/root
        crond -f -l 8
    volumes:
      - "${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}:${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}"
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  docker-admin:
    internal: true

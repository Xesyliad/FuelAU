services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-18080}:80"
    volumes:
      - ./config/app.env:/etc/fuelapi/app.env:ro
      - ./config/mysql.env:/etc/fuelapi/mysql.env:ro
      - ./var/docker:/var/www/html/var/docker
      - ./var/docker/app-logs:/var/log/fuelapi
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_ENV: "${APP_ENV:-local}"
      CONTAINER_MANAGEMENT_ENABLED: "${CONTAINER_MANAGEMENT_ENABLED:-false}"
      CONTAINER_MANAGEMENT_TOKEN: "${CONTAINER_MANAGEMENT_TOKEN:-}"
      FUELAU_DOCKER_PROJECT: "${COMPOSE_PROJECT_NAME:-fuelau}"
      TZ: "${TZ:-Australia/Brisbane}"
    restart: unless-stopped

  db:
    image: mariadb:11.4
    user: "${UID:-999}:${GID:-999}"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-fuelau}"
      MYSQL_USER: "${MYSQL_USER:-fuelau}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
      TZ: "${TZ:-Australia/Brisbane}"
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ./var/docker/db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nominatim:
    image: mediagis/nominatim:5.1
    profiles:
      - routing
    depends_on:
      app:
        condition: service_started
    environment:
      PBF_URL: https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/australia-oceania/australia-updates
      UPDATE_MODE: continuous
      NOMINATIM_PASSWORD: "${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD in .env}"
      THREADS: "${NOMINATIM_THREADS:-4}"
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
      FREEZE: "false"
      TZ: "${TZ:-Australia/Brisbane}"
    ports:
      - "127.0.0.1:${NOMINATIM_HTTP_PORT:-18081}:8080"
    volumes:
      - ./var/docker/nominatim-db:/var/lib/postgresql
      - ./var/docker/nominatim-flatnode:/nominatim/flatnode
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/status.php', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m
    restart: unless-stopped

  osrm-download:
    image: curlimages/curl:8.10.1
    profiles:
      - routing-setup
    user: "0:0"
    command:
      - -L
      - --fail
      - --output
      - /data/australia-latest.osm.pbf
      - https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
    volumes:
      - ./var/docker/osrm-data:/data

  osrm-extract:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles:
      - routing-setup
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    command:
      - osrm-extract
      - -p
      - /opt/fuelmiser.car.lua
      - /data/australia-latest.osm.pbf
    volumes:
      - ./config/osrm/fuelmiser.car.profile.template.lua:/opt/fuelmiser.car.lua:ro
      - ./var/docker/osrm-data:/data

  osrm-partition:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles:
      - routing-setup
    depends_on:
      osrm-extract:
        condition: service_completed_successfully
    command:
      - osrm-partition
      - /data/australia-latest.osrm
    volumes:
      - ./var/docker/osrm-data:/data

  osrm-customize:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles:
      - routing-setup
    depends_on:
      osrm-partition:
        condition: service_completed_successfully
    command:
      - osrm-customize
      - /data/australia-latest.osrm
    volumes:
      - ./var/docker/osrm-data:/data

  osrm-routed:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles:
      - routing
    depends_on:
      app:
        condition: service_started
      osrm-customize:
        condition: service_completed_successfully
        required: false
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/australia-latest.osrm
    ports:
      - "127.0.0.1:${OSRM_HTTP_PORT:-15000}:5000"
    volumes:
      - ./var/docker/osrm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/5000'"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  map-build:
    image: ghcr.io/onthegomap/planetiler:latest
    profiles:
      - map-setup
    environment:
      JAVA_TOOL_OPTIONS: "${MAP_BUILD_JAVA_TOOL_OPTIONS:--Xmx4g}"
      TZ: "${TZ:-Australia/Brisbane}"
    command:
      - --download
      - --area=australia
      - --output=/data/australia.mbtiles
      - --maxzoom=13
      - --render_maxzoom=13
      - --threads=2
      - --force
    volumes:
      - ./var/docker/map-tiles:/data

  terrain-build:
    image: python:3.12-slim
    profiles:
      - map-setup
    environment:
      TZ: "${TZ:-Australia/Brisbane}"
    command:
      - python
      - /workspace/scripts/build-terrain-mbtiles.py
      - --output=/data/terrain.mbtiles
      - --workers=4
      - --max-zoom=8
    volumes:
      - ./var/docker/map-tiles:/data
      - ./scripts:/workspace/scripts:ro

  map-server:
    image: maptiler/tileserver-gl-light:v5.6.0
    profiles:
      - map
    depends_on:
      app:
        condition: service_started
      map-build:
        condition: service_completed_successfully
        required: false
      terrain-build:
        condition: service_completed_successfully
        required: false
    command:
      - --public_url
      - /tiles/
    ports:
      - "127.0.0.1:${MAP_TILE_PORT:-18082}:8080"
    volumes:
      - ./var/docker/map-tiles:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http'); const checks=['http://127.0.0.1:8080/styles.json','http://127.0.0.1:8080/data/australia.json','http://127.0.0.1:8080/data/australia/13/7536/4916.pbf']; const check=(url)=>new Promise((resolve,reject)=>{http.get(url,res=>{res.resume(); if(res.statusCode===200) resolve(); else reject(new Error(url+' status '+res.statusCode));}).on('error',reject);}); Promise.all(checks.map(check)).then(()=>process.exit(0)).catch(()=>process.exit(1));\""
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1m
    restart: unless-stopped

  map-scheduler:
    image: docker:27-cli
    profiles:
      - map
    depends_on:
      map-server:
        condition: service_healthy
        required: false
    working_dir: "${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}"
    environment:
      FUELAU_HOST_PROJECT_ROOT: "${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}"
      TZ: "${TZ:-Australia/Brisbane}"
    command:
      - sh
      - -c
      - |
        mkdir -p var/docker/app-logs
        printf '%s\n' "5 3 * * 0 cd $${FUELAU_HOST_PROJECT_ROOT} && docker compose --profile map-setup run --rm terrain-build >> var/docker/app-logs/terrain_build.log 2>&1" > /etc/crontabs/root
        printf '%s\n' "10 3 * * 0 cd $${FUELAU_HOST_PROJECT_ROOT} && docker compose --profile map-setup run --rm map-build >> var/docker/app-logs/map_build.log 2>&1" >> /etc/crontabs/root
        crond -f -l 8
    volumes:
      - "${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}:${FUELAU_HOST_PROJECT_ROOT:-/opt/FuelAU}"
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

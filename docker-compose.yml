services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-18080}:80"
    volumes:
      - .:/var/www/html
      - ./config/mysql.env:/etc/fuelapi/mysql.env:ro
      - ./var/docker/app-logs:/var/log/fuelapi
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_ENV: "${APP_ENV:-local}"
      FUELAU_DOCKER_PROJECT: "${COMPOSE_PROJECT_NAME:-fuelau}"
      TZ: "${TZ:-Australia/Brisbane}"
    restart: unless-stopped

  db:
    image: mariadb:11.4
    user: "999:999"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-fuelau}"
      MYSQL_USER: "${MYSQL_USER:-fuelau}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
      TZ: "${TZ:-Australia/Brisbane}"
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ./var/docker/db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nominatim:
    image: mediagis/nominatim:5.1
    profiles:
      - routing
    environment:
      PBF_URL: https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/australia-oceania/australia-updates
      NOMINATIM_PASSWORD: "${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD in .env}"
      THREADS: "${NOMINATIM_THREADS:-4}"
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
      FREEZE: "false"
      TZ: "${TZ:-Australia/Brisbane}"
    ports:
      - "127.0.0.1:${NOMINATIM_HTTP_PORT:-18081}:8080"
    volumes:
      - ./var/docker/nominatim-db:/var/lib/postgresql
      - ./var/docker/nominatim-flatnode:/nominatim/flatnode
    shm_size: 1gb
    restart: unless-stopped

  osrm-download:
    image: curlimages/curl:8.10.1
    profiles:
      - routing-setup
    user: "0:0"
    command:
      - -L
      - --fail
      - --output
      - /data/australia-latest.osm.pbf
      - https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
    volumes:
      - ./var/docker/osrm-data:/data

  osrm-extract:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles:
      - routing-setup
    command:
      - osrm-extract
      - -p
      - /opt/car.lua
      - /data/australia-latest.osm.pbf
    volumes:
      - ./var/docker/osrm-data:/data

  osrm-partition:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles:
      - routing-setup
    command:
      - osrm-partition
      - /data/australia-latest.osrm
    volumes:
      - ./var/docker/osrm-data:/data

  osrm-customize:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles:
      - routing-setup
    command:
      - osrm-customize
      - /data/australia-latest.osrm
    volumes:
      - ./var/docker/osrm-data:/data

  osrm-routed:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles:
      - routing
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/australia-latest.osrm
    ports:
      - "127.0.0.1:${OSRM_HTTP_PORT:-15000}:5000"
    volumes:
      - ./var/docker/osrm-data:/data
    restart: unless-stopped

global
    log stdout format raw local0
    maxconn 128
    # Socket access requires root; the container is otherwise read-only, capability-free, and API-allowlisted.
    user root

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 10m

frontend docker_api
    bind :2375

    acl read_method method GET HEAD
    acl read_containers path -m reg ^/containers/json$
    acl read_logs path -m reg ^/containers/[a-f0-9]+/logs$
    acl read_disk path -m str /system/df

    acl post_method method POST
    acl restart_container path -m reg ^/containers/[a-f0-9]+/restart$
    acl prune_containers path -m str /containers/prune
    acl prune_images path -m str /images/prune

    http-request deny unless read_method read_containers or read_method read_logs or read_method read_disk or post_method restart_container or post_method prune_containers or post_method prune_images

    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock

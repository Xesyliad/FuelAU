name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: dom, mbstring, pdo_mysql, xmlwriter
          coverage: none

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install quality tools
        run: |
          composer install --no-interaction --prefer-dist
          python -m pip install -r requirements-ci.txt
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run PHP tests and analysis
        run: |
          composer audit --locked --no-interaction
          composer test
          composer analyse
          composer analyse:new
          composer format:check
          find src migrations tests/php tests/phpunit -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Scan PHP for security issues
        run: |
          semgrep scan \
            --config p/php \
            --config p/phpcs-security-audit \
            --error \
            --metrics=off \
            --exclude vendor \
            --exclude var \
            src public migrations templates tests/php tests/phpunit setup.php

      - name: Run Python tests and analysis
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/python -p 'test_*.py' -v
          ruff check src tests/python scripts/build-terrain-mbtiles.py
          mypy

      - name: Validate shell, Compose, and rendered JavaScript
        run: |
          find docker scripts tests -type f \( -name '*.sh' -o -name run \) -print0 |
            xargs -0 shellcheck
          docker compose --env-file .env.sample --profile admin config --quiet
          node --check public/resources/app.js
          FUELAU_MYSQL_ENV_PATH="$PWD/config/mysql-sample.env" \
            FUELAU_APP_ENV_PATH="$PWD/config/app-sample.env" \
            php -r '$_SERVER["REQUEST_URI"]="/"; $_SERVER["REQUEST_METHOD"]="GET"; require "public/index.php";' |
            node --input-type=module -e 'let source=""; for await (const chunk of process.stdin) source += chunk; const scripts=[...source.matchAll(/<script(?:\s+nonce="[^"]+")?>([\s\S]*?)<\/script>/g)].map((match)=>match[1]); scripts.forEach((script)=>new Function(script));'

      - name: Build application containers
        run: docker compose --env-file .env.sample build app map-build
